version: '3.8'

services:

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: architect-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: architect-zookeeper
    ports:
      - "2181:2181"

  redis:
    image: redis:7
    container_name: architect-redis
    ports:
      - "6379:6379"

  node-app:
    build: .
    container_name: node-app
    ports:
      - "8000:8080"
    restart: always

  nginx:
    image: nginx:latest
    container_name: architect-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - node-app
